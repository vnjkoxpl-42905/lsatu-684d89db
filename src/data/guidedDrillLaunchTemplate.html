<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f5f2ed;
      --ink: #1a1a1a;
      --muted: rgba(26, 26, 26, 0.58);
      --soft: rgba(26, 26, 26, 0.38);
      --line: rgba(26, 26, 26, 0.10);
      --line-strong: rgba(26, 26, 26, 0.22);
      --white: #ffffff;
      --cream: #faf7ef;
      --shadow: 0 26px 76px rgba(26, 26, 26, 0.12);
      --soft-shadow: 0 14px 34px rgba(26, 26, 26, 0.075);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      padding: 32px clamp(18px, 4vw, 56px) 56px;
      background:
        radial-gradient(circle at 16% 0%, rgba(255,255,255,.82), transparent 28%),
        radial-gradient(circle at 88% 3%, rgba(26,26,26,.048), transparent 30%),
        var(--bg);
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .breadcrumb {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      font: inherit;
      color: rgba(26,26,26,.52);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-weight: 850;
      text-decoration: none;
      transition: color 160ms ease, transform 160ms ease;
    }

    .breadcrumb:hover {
      color: var(--ink);
      transform: translateX(-2px);
    }

    .brand-block { line-height: 1.1; }
    .brand-block .label,
    .brand-block .sub,
    .micro-label,
    .drawer-label,
    .summary-label,
    .stat-tag,
    .signal-title {
      text-transform: uppercase;
      font-weight: 850;
    }

    .brand-block .label {
      margin-bottom: 5px;
      color: var(--ink);
      font-size: 10px;
      letter-spacing: .30em;
    }

    .brand-block .sub {
      color: rgba(26,26,26,.48);
      font-size: 10px;
      letter-spacing: .30em;
    }

    .page {
      width: min(100%, 1180px);
      margin: 0 auto;
    }

    .launch-screen {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 390px);
      gap: clamp(34px, 5vw, 68px);
      align-items: center;
      min-height: calc(100vh - 178px);
      padding-bottom: 34px;
    }

    .hero-copy { min-width: 0; }

    .micro-label {
      margin-bottom: 18px;
      color: rgba(26,26,26,.46);
      font-size: 10px;
      letter-spacing: .30em;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(72px, 10vw, 136px);
      font-style: italic;
      font-weight: 500;
      line-height: .80;
      letter-spacing: -.08em;
    }

    button, .ghost-btn {
      font: inherit;
    }

    .primary-start {
      position: relative;
      width: 100%;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: var(--bg);
      padding: 30px 30px;
      cursor: pointer;
      box-shadow: 0 28px 64px rgba(26,26,26,.22);
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease, background 220ms ease;
    }

    .primary-start::before {
      content: "";
      position: absolute;
      inset: 1px;
      border: 1px solid rgba(245,242,237,.13);
      pointer-events: none;
    }

    .primary-start:hover {
      transform: translateY(-5px);
      background: rgba(26,26,26,.90);
      box-shadow: 0 34px 78px rgba(26,26,26,.27);
    }

    .primary-start-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px;
      gap: 24px;
      align-items: center;
    }

    .start-label {
      display: none;
    }

    .start-title {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 6vw, 86px);
      font-style: italic;
      line-height: .88;
      letter-spacing: -.08em;
      text-align: left;
    }

    .start-meta {
      display: none;
    }

    .start-arrow {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245,242,237,.18);
      font-size: 33px;
      font-weight: 850;
      transition: transform 220ms ease, background 220ms ease;
    }

    .primary-start:hover .start-arrow {
      transform: translateX(7px);
      background: rgba(245,242,237,.08);
    }

    .read-notes-btn,
    .small-start-btn {
      width: 100%;
      border-radius: 2px;
      padding: 17px 24px;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .20em;
      font-weight: 850;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .read-notes-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.60);
      color: var(--ink);
    }

    .read-notes-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(26,26,26,.28);
      background: #fff;
      box-shadow: var(--soft-shadow);
    }

    .small-start-btn {
      border: 0;
      background: var(--ink);
      color: var(--bg);
      box-shadow: 0 16px 34px rgba(26,26,26,.18);
    }

    .small-start-btn:hover {
      transform: translateY(-2px);
      background: rgba(26,26,26,.88);
      box-shadow: 0 20px 42px rgba(26,26,26,.22);
    }

    .summary-card {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 2px;
      padding: 1px;
      box-shadow: var(--shadow);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .summary-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(26,26,26,.13);
    }

    .summary-inner {
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 2px;
      background: var(--ink);
      color: var(--bg);
      padding: 31px;
    }

    .summary-label {
      margin-bottom: 9px;
      color: rgba(245,242,237,.42);
      font-size: 10px;
      letter-spacing: .30em;
    }

    .summary-title {
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      border-top: 1px solid rgba(245,242,237,.12);
      padding-top: 24px;
      margin-top: 28px;
    }

    .summary-metric-label {
      margin-bottom: 7px;
      color: rgba(245,242,237,.34);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 850;
    }

    .summary-metric-value {
      color: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-style: italic;
      line-height: 1;
    }

    .scroll-hint {
      width: 100%;
      margin-top: 24px;
      border-top: 1px solid rgba(245,242,237,.12);
      padding-top: 18px;
      color: rgba(245,242,237,.46);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-weight: 850;
    }

    .notes-drawer {
      margin-top: 56px;
      opacity: 1;
      overflow: visible;
      transform: translateY(0);
      scroll-margin-top: 28px;
    }

    .notes-drawer .drawer-shell {
      animation: noteDrawerEnter 760ms cubic-bezier(.2,.7,.2,1) both;
    }

    .drawer-shell {
      display: grid;
      grid-template-columns: minmax(0, 920px);
      justify-content: center;
      gap: 30px;
      align-items: start;
    }

    .note-card, .side-card {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 2px;
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }

    .note-section {
      padding: 34px 40px;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(26px);
      transition:
        opacity 720ms cubic-bezier(.2,.7,.2,1),
        transform 720ms cubic-bezier(.2,.7,.2,1),
        background 220ms ease,
        border-color 220ms ease;
    }

    .note-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .note-section:hover {
      background: rgba(250,247,239,.42);
    }

    .note-section:last-child { border-bottom: 0; }

    .drawer-label, .section-kicker {
      margin-bottom: 18px;
      color: rgba(26,26,26,.48);
      font-size: 10px;
      letter-spacing: .26em;
    }

    .copy {
      min-width: 0;
      overflow-wrap: break-word;
      color: rgba(26,26,26,.86);
      font-size: 20px;
      line-height: 1.68;
      letter-spacing: -.02em;
    }

    .copy p {
      margin: 0 0 20px;
      transition: color 220ms ease, transform 220ms ease;
    }

    .copy p:hover {
      color: var(--ink);
      transform: translateX(2px);
    }

    .copy p:last-child { margin-bottom: 0; }

    strong { color: var(--ink); font-weight: 850; }

    .lead-line {
      position: relative;
      display: block;
      margin-bottom: 24px !important;
      padding: 25px 27px;
      border: 1px solid var(--line);
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 48px);
      font-style: italic;
      line-height: 1.04;
      letter-spacing: -.055em;
      overflow: hidden;
    }

    .lead-line::after,
    .emphasis-card::after,
    .question-box::after {
      content: "";
      position: absolute;
      height: 1px;
      background: rgba(26,26,26,.18);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 520ms cubic-bezier(.2,.7,.2,1);
    }

    .lead-line::after {
      left: 27px;
      right: 27px;
      bottom: 19px;
    }

    .lead-line:hover::after,
    .lead-line.is-visible::after,
    .emphasis-card:hover::after,
    .emphasis-card.is-visible::after,
    .question-box:hover::after,
    .question-box.is-visible::after {
      transform: scaleX(1);
    }

    .punchline {
      display: inline-block;
      position: relative;
      font-weight: 900;
    }

    .punchline::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 8px;
      background: rgba(26,26,26,.10);
      z-index: -1;
      transform: skewX(-10deg) scaleX(0);
      transform-origin: left;
      transition: transform 420ms cubic-bezier(.2,.7,.2,1);
    }

    .lead-line:hover .punchline::after,
    .lead-line.is-visible .punchline::after {
      transform: skewX(-10deg) scaleX(1);
    }

    .emphasis-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin: 28px 0;
    }

    .emphasis-card,
    .signal-card,
    .question-box {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 2px;
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease, background 220ms ease;
    }

    .emphasis-card {
      min-height: 132px;
      background: var(--bg);
      padding: 22px 18px;
    }

    .emphasis-card::after {
      left: 18px;
      right: 18px;
      bottom: 16px;
      height: 2px;
      background: var(--ink);
      opacity: .24;
    }

    .emphasis-card:hover,
    .signal-card:hover,
    .question-box:hover {
      transform: translateY(-4px);
      border-color: rgba(26,26,26,.32);
      background: #fff;
      box-shadow: var(--soft-shadow);
    }

    .feature-stat {
      background: var(--ink);
      color: var(--bg);
    }

    .feature-stat:hover {
      background: var(--ink);
      border-color: var(--ink);
      box-shadow: 0 20px 44px rgba(26,26,26,.18);
    }

    .feature-stat::after {
      background: var(--bg);
      opacity: .34;
    }

    .stat-tag {
      margin-bottom: 14px;
      color: rgba(26,26,26,.38);
      font-size: 9px;
      letter-spacing: .22em;
    }

    .feature-stat .stat-tag,
    .feature-stat .emphasis-caption,
    .feature-stat .emphasis-number {
      color: var(--bg);
    }

    .emphasis-number {
      margin-bottom: 13px;
      color: var(--ink);
      font-size: 46px;
      font-weight: 850;
      line-height: .9;
      letter-spacing: -.07em;
    }

    .emphasis-caption {
      color: rgba(26,26,26,.58);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .instruction-panel {
      position: relative;
      margin-bottom: 16px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: var(--bg);
      padding: 28px;
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .instruction-panel:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 44px rgba(26,26,26,.16);
    }

    .instruction-label {
      margin-bottom: 18px;
      color: rgba(245,242,237,.46);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .28em;
      font-weight: 850;
    }

    .instruction-command {
      margin: 0;
      max-width: 760px;
      color: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 4.2vw, 58px);
      font-style: italic;
      line-height: 1.02;
      letter-spacing: -.065em;
    }

    .drawer-start {
      width: 100%;
      margin: 0 0 26px;
    }

    .focus-sentence {
      margin-top: 18px !important;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--cream);
      padding: 22px 24px;
      font-size: 22px;
      line-height: 1.52;
      letter-spacing: -.025em;
    }

    .approach-flow {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-top: 22px;
    }

    .flow-card {
      min-height: 108px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--bg);
      padding: 18px;
      transition: transform 220ms ease, border-color 220ms ease, background 220ms ease, box-shadow 220ms ease;
    }

    .flow-card:hover {
      transform: translateY(-3px);
      border-color: rgba(26,26,26,.32);
      background: #fff;
      box-shadow: var(--soft-shadow);
    }

    .flow-label {
      margin-bottom: 10px;
      color: rgba(26,26,26,.42);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .24em;
      font-weight: 850;
    }

    .flow-text {
      color: rgba(26,26,26,.78);
      font-size: 15px;
      line-height: 1.42;
      font-weight: 720;
    }

    .flow-arrow {
      color: rgba(26,26,26,.32);
      font-size: 22px;
      font-weight: 850;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 22px 0;
    }

    .signal-card {
      min-height: 166px;
      background: var(--bg);
      padding: 22px;
    }

    .signal-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--ink);
      opacity: .28;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 360ms cubic-bezier(.2,.7,.2,1);
    }

    .signal-card:hover::before,
    .signal-card.is-visible::before {
      transform: scaleY(1);
    }

    .signal-title {
      margin-bottom: 13px;
      color: rgba(26,26,26,.48);
      font-size: 10px;
      letter-spacing: .25em;
    }

    .signal-card p {
      margin: 0;
      color: rgba(26,26,26,.82);
      font-size: 16px;
      line-height: 1.55;
    }

    .question-box {
      margin-top: 18px;
      background: var(--cream);
      padding: 28px 28px 28px 74px;
      color: rgba(26,26,26,.9);
      font-size: 22px;
      line-height: 1.42;
      letter-spacing: -.03em;
    }

    .question-box::before {
      content: "?";
      position: absolute;
      left: 24px;
      top: 24px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 24px;
    }

    .question-box::after {
      inset: auto 20px 18px 74px;
    }

    .side {
      position: sticky;
      top: 26px;
      display: grid;
      gap: 14px;
    }

    .side-head {
      padding: 20px 18px;
      border-bottom: 1px solid var(--line);
    }

    .side-label {
      margin-bottom: 8px;
      color: rgba(26,26,26,.42);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .28em;
      font-weight: 850;
    }

    .side-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .side-body { padding: 16px 18px 18px; }

    .focus-pill {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--bg);
      padding: 13px 14px;
      color: rgba(26,26,26,.78);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 850;
    }

    .outline {
      display: grid;
      gap: 7px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .outline a {
      display: block;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--bg);
      padding: 11px 12px;
      color: rgba(26,26,26,.58);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 850;
      text-underline-offset: 3px;
      transition: 160ms ease;
    }

    .outline a:hover {
      color: var(--ink);
      border-color: rgba(26,26,26,.28);
      background: #fff;
      box-shadow: var(--soft-shadow);
      transform: translateX(4px);
    }

    .toc-island-wrap {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 60;
      transform: translate(-50%, 28px) scale(.96);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 340ms cubic-bezier(.2,.7,.2,1);
    }

    .toc-island-wrap.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .toc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(26,26,26,.18);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    .toc-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .toc-island {
      width: 292px;
      height: 54px;
      border: 1px solid rgba(26,26,26,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 24px 60px rgba(26,26,26,.18);
      overflow: hidden;
      transition:
        width 420ms cubic-bezier(.2,.7,.2,1),
        height 420ms cubic-bezier(.2,.7,.2,1),
        border-radius 420ms cubic-bezier(.2,.7,.2,1),
        background 220ms ease;
    }

    .toc-island.open {
      width: min(360px, calc(100vw - 28px));
      height: 320px;
      border-radius: 26px;
      background: rgba(255,255,255,.97);
    }

    .toc-closed {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 17px;
      cursor: pointer;
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      transition: opacity 240ms ease, transform 240ms ease, filter 240ms ease;
    }

    .toc-island.open .toc-closed {
      opacity: 0;
      transform: scale(.96);
      filter: blur(4px);
      pointer-events: none;
    }

    .toc-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--ink);
      flex: 0 0 auto;
    }

    .toc-active-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: -.01em;
    }

    .toc-ring {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      transform: rotate(-90deg);
    }

    .toc-ring circle {
      fill: none;
      stroke-width: 2.5;
    }

    .toc-ring .track { stroke: rgba(26,26,26,.14); }
    .toc-ring .progress {
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-dasharray: 69;
      stroke-dashoffset: 69;
      transition: stroke-dashoffset 140ms ease-out;
    }

    .toc-expanded {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
      transition: opacity 260ms ease 80ms, transform 260ms ease 80ms;
    }

    .toc-island.open .toc-expanded {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .toc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 20px 13px;
      border-bottom: 1px solid var(--line);
    }

    .toc-label {
      color: rgba(26,26,26,.46);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .20em;
      font-weight: 850;
    }

    .toc-close {
      border: 0;
      background: transparent;
      color: rgba(26,26,26,.52);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: color 160ms ease, transform 160ms ease;
    }

    .toc-close:hover {
      color: var(--ink);
      transform: rotate(90deg);
    }

    .toc-list {
      display: grid;
      gap: 6px;
      align-content: start;
      padding: 12px;
      overflow-y: auto;
    }

    .toc-item {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(26,26,26,.48);
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .toc-item:hover {
      background: rgba(26,26,26,.06);
      color: rgba(26,26,26,.86);
      transform: translateX(3px);
    }

    .toc-item.active {
      background: rgba(26,26,26,.10);
      color: var(--ink);
      font-weight: 850;
    }

    .enter-soft { animation: softEnter 720ms cubic-bezier(.2,.7,.2,1) both; }
    .delay-1 { animation-delay: 80ms; }
    .delay-2 { animation-delay: 160ms; }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity 720ms cubic-bezier(.2,.7,.2,1),
        transform 720ms cubic-bezier(.2,.7,.2,1),
        background 220ms ease,
        border-color 220ms ease,
        box-shadow 220ms ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal.stagger-1 { transition-delay: 70ms; }
    .reveal.stagger-2 { transition-delay: 140ms; }
    .reveal.stagger-3 { transition-delay: 210ms; }
    .reveal.stagger-4 { transition-delay: 280ms; }

    @keyframes noteDrawerEnter {
      from {
        opacity: 0;
        transform: translateY(22px) scale(.992);
        filter: blur(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes softEnter {
      from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes revealLift {
      from { opacity: .78; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      .notes-drawer { transition: none; }
      .reveal,
      .note-section {
        opacity: 1;
        transform: none;
      }
      .toc-island-wrap,
      .toc-backdrop,
      .toc-island,
      .toc-closed,
      .toc-expanded,
      .toc-item {
        transition: none !important;
      }
    }

    @media (max-width: 1050px) {
      .launch-screen,
      .drawer-shell {
        grid-template-columns: 1fr;
      }
      .launch-screen { min-height: auto; }
    }

    @media (max-width: 760px) {
      .app { padding: 22px 14px 42px; }
      .topbar { flex-direction: column; align-items: flex-start; margin-bottom: 38px; }
      .nav-actions { justify-content: flex-start; gap: 16px; }
      h1 { font-size: 62px; }
      .toc-island { width: min(292px, calc(100vw - 28px)); }
      .summary-inner { min-height: 0; }
      .primary-start-grid,
      .approach-flow { grid-template-columns: 1fr; }
      .start-arrow { width: 100%; height: 54px; }
      .flow-arrow { transform: rotate(90deg); text-align: center; }
      .note-section { padding: 28px 22px; }
      .copy { font-size: 18px; }
      .focus-sentence, .question-box { font-size: 19px; }
      .question-box { padding: 72px 22px 24px; }
      .question-box::before { top: 22px; left: 22px; }
    }

    /* ------------------------------------------------------------------
       Offline artifact: the embedded questions.

       Only rendered when the generator supplies them, so the platform page is
       byte-identical to what it was. Everything here uses the tokens declared
       at the top of this file and reaches for nothing off the machine, which
       is what lets the finished file travel as an email attachment.
       ------------------------------------------------------------------ */

    .questions {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(20px, 5vw, 64px) 96px;
    }

    .questions-head {
      margin: 0 0 34px;
      padding-top: 18px;
      border-top: 1px solid var(--line-strong);
    }

    .questions-head .section-kicker { margin-bottom: 10px; }

    .questions-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 3.4vw, 44px);
      letter-spacing: -.045em;
      line-height: 1.04;
    }

    .questions-head p {
      margin: 12px 0 0;
      max-width: 60ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .question {
      margin: 0 0 26px;
      padding: 30px clamp(20px, 3vw, 38px) 34px;
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: var(--soft-shadow);
    }

    .q-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .24em;
      font-weight: 850;
    }

    .q-num { color: var(--ink); }
    .q-ref { margin-left: auto; letter-spacing: .16em; }

    .stimulus {
      margin: 0 0 20px;
      font-size: 17px;
      line-height: 1.66;
      white-space: pre-wrap;
    }

    .stem {
      margin: 0 0 18px;
      font-weight: 650;
      font-size: 17px;
      line-height: 1.55;
    }

    .choices { margin: 0; padding: 0; list-style: none; }

    .choices li { margin: 0 0 8px; }

    .choice {
      display: flex;
      gap: 14px;
      width: 100%;
      padding: 13px 16px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease;
    }

    .choice:hover { background: var(--cream); border-color: var(--line-strong); }

    .choice-letter {
      flex: 0 0 auto;
      font-weight: 850;
      letter-spacing: .06em;
    }

    .choice[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    /* After the commit the choices stop being controls and become a record. */
    .question[data-locked="true"] .choice { cursor: default; }
    .question[data-locked="true"] .choice:hover { background: transparent; border-color: var(--line); }
    .question[data-locked="true"] .choice[aria-pressed="true"]:hover { background: var(--ink); }

    /*
     * The credited answer reads as itself through weight and fill, not a side
     * tab: this document separates things with full hairlines and background
     * changes everywhere else, and one accent bar on one card would look
     * borrowed from somewhere it does not belong.
     */
    .question[data-locked="true"] .choice[data-correct="true"] {
      border-color: var(--ink);
      background: var(--cream);
      color: var(--ink);
      font-weight: 650;
    }

    .question[data-locked="true"] .choice[aria-pressed="true"][data-correct="false"] {
      background: transparent;
      border-color: var(--line-strong);
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .submit {
      margin-top: 18px;
      padding: 11px 22px;
      background: var(--ink);
      border: 1px solid var(--ink);
      color: var(--bg);
      font: inherit;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .submit:disabled { opacity: .32; cursor: not-allowed; }

    /*
     * Deliberately NOT called .reveal: that class already exists above as the
     * scroll-entrance animation (opacity 0 until an observer adds .is-visible).
     * Sharing the name made the answer's appearance depend on an animation
     * system that has no reason to know about it.
     */
    /* A full rule above, the way .questions-head and .q-head already separate
       registers in this file. */
    .answer-reveal {
      margin-top: 22px;
      padding: 20px 2px 0;
      border-top: 1px solid var(--ink);
      opacity: 1;
    }

    .answer-reveal[hidden] { display: none; }

    .answer-reveal .section-kicker { margin-bottom: 10px; }

    .answer-reveal p { margin: 0 0 10px; font-size: 15px; line-height: 1.6; }
    .answer-reveal p:last-child { margin-bottom: 0; }

    .answer-reveal .trap { color: var(--muted); }

    .verdict {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-style: italic;
      letter-spacing: -.02em;
    }

    .scoreboard {
      margin-top: 40px;
      padding: 30px clamp(20px, 3vw, 38px);
      background: var(--ink);
      color: var(--bg);
    }

    .scoreboard h3 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-style: italic;
      letter-spacing: -.03em;
    }

    .scoreboard p { margin: 0; color: rgba(245, 242, 237, .72); font-size: 15px; line-height: 1.6; }

    #answer-key { display: none; }

    /* ------------------------------------------------------------------
       Print. These rules live inside this same inline <style> on purpose: a
       separate stylesheet cannot travel with a single-file attachment, and the
       PDF is nothing more than this file rendered with print media emulated.

       A printed sheet cannot gate a reveal, so it becomes a plain attempt
       sheet with the key at the back.
       ------------------------------------------------------------------ */
    @media print {
      :root { --bg: #ffffff; }

      body { background: #fff; }

      .topbar,
      .summary-card,
      .scroll-hint,
      .toc-island-wrap,
      .toc-backdrop,
      .notes-drawer,
      .submit,
      .answer-reveal,
      .scoreboard { display: none !important; }

      .app, .page, .questions { max-width: none; padding: 0; margin: 0; }

      /*
       * The launch screen is a two-column grid: hero on the left, START card on
       * the right. Hiding the card does not release its column, so the hero
       * kept its screen width and overflowed the printed page entirely — the
       * drill title was missing from the PDF. Collapse to one column and cap
       * the viewport-relative type, which has no sensible meaning on paper.
       */
      .launch-screen {
        display: block;
        min-height: 0;
        padding: 0 0 18px;
      }

      .hero-copy h1 { font-size: 30px !important; line-height: 1.08; }
      .hero-copy { animation: none; opacity: 1; }

      /* Entrance animations never run in print, so anything relying on one to
         become visible would print blank. */
      .enter-soft, .reveal { animation: none !important; opacity: 1 !important; transform: none !important; }

      .question {
        border: none;
        border-top: 1px solid #000;
        box-shadow: none;
        padding: 16px 0;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Nothing to press on paper: choices become lettered lines with a box. */
      .choice {
        border: none;
        padding: 3px 0;
        background: none !important;
        color: #000 !important;
        text-decoration: none !important;
      }

      .choice::before {
        content: "";
        flex: 0 0 auto;
        width: 11px;
        height: 11px;
        margin-top: 5px;
        border: 1px solid #000;
      }

      #answer-key {
        display: block;
        break-before: page;
        page-break-before: always;
        padding-top: 18px;
      }

      #answer-key table { width: 100%; border-collapse: collapse; font-size: 12px; }
      #answer-key th, #answer-key td { padding: 5px 8px; border-bottom: 1px solid #ddd; text-align: left; }
    }
  </style>
</head>
<body data-mode="{{ARTIFACT_MODE}}">
  <div class="app">
    <header class="topbar enter-soft">
      <button class="breadcrumb" type="button" data-return="true" aria-label="Return to Logical Reasoning">← Return</button>
    </header>

    <main class="page">
      <section class="launch-screen">
        <div class="hero-copy enter-soft delay-1">
          <h1>{{TITLE}}</h1>
        </div>

        <aside class="summary-card enter-soft delay-2" aria-label="Drill summary">
          <div class="summary-inner">
            <div>
              <button class="primary-start" data-start-drill="true" aria-label="Start drill">
                <span class="primary-start-grid">
                  <span>
                    <span class="start-title">START DRILL</span>
                  </span>
                  <span class="start-arrow">→</span>
                </span>
              </button>

              <div class="summary-grid">
                <div>
                  <div class="summary-metric-label">Time</div>
                  <div class="summary-metric-value">{{TIME}}</div>
                </div>
                <div>
                  <div class="summary-metric-label">Questions</div>
                  <div class="summary-metric-value">{{QUESTIONS}}</div>
                </div>
              </div>

              {{SCROLL_HINT}}
            </div>
          </div>
        </aside>
      </section>

      {{NOTES}}
    </main>

    {{QUESTIONS_SECTION}}
  </div>

  <script>
    const returnButton = document.querySelector('[data-return="true"]');
    if (returnButton) {
      returnButton.addEventListener('click', () => {
        // Mirror the start button: tell the host app to navigate. Falls back to
        // history only when this page is opened standalone (no parent frame).
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'lsatu:return-guided-drill' }, '*');
            return;
          }
        } catch (e) {}
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/';
        }
      });
    }

    // 'artifact' means this file was opened on its own — from an email, from
    // disk — so there is no parent frame and the questions are embedded below.
    const artifactMode = document.body.dataset.mode === 'artifact';

    const startDrillButtons = Array.from(document.querySelectorAll('[data-start-drill="true"]'));
    startDrillButtons.forEach(button => {
      button.addEventListener('click', () => {
        if (artifactMode) {
          const first = document.querySelector('.question');
          if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        // Use '*' as target origin so this works for both same-origin curated
        // pages and srcDoc-rendered launch pages (which have opaque "null" origin
        // and would otherwise throw "Invalid target origin 'null'").
        try { window.parent.postMessage({ type: 'lsatu:start-guided-drill' }, '*'); } catch (e) {}
      });
    });

    const notesDrawer = document.getElementById('notesDrawer');

    const tocIslandWrap = document.getElementById('tocIslandWrap');
    const tocIsland = document.getElementById('tocIsland');
    const tocBackdrop = document.getElementById('tocBackdrop');
    const tocOpenBtn = document.getElementById('tocOpenBtn');
    const tocCloseBtn = document.getElementById('tocCloseBtn');
    const tocList = document.getElementById('tocList');
    const tocActiveTitle = document.getElementById('tocActiveTitle');
    const tocProgress = document.getElementById('tocProgress');

    // Sections are discovered from the rendered notes drawer, so the TOC works
    // for any drill regardless of how many sections its notes produce.
    const tocSections = Array.from(document.querySelectorAll('.note-section[id]')).map(el => ({
      id: el.id,
      title: el.getAttribute('data-toc-title') || el.querySelector('.section-kicker')?.textContent?.trim() || 'Notes'
    }));

    const tocEnabled = Boolean(
      notesDrawer && tocIslandWrap && tocIsland && tocBackdrop &&
      tocOpenBtn && tocCloseBtn && tocList && tocActiveTitle && tocProgress &&
      tocSections.length > 0
    );

    let tocItems = [];

    function setTocOpen(open) {
      tocIsland.classList.toggle('open', open);
      tocBackdrop.classList.toggle('visible', open);
      tocOpenBtn.setAttribute('aria-expanded', String(open));
    }

    function buildToc() {
      tocList.innerHTML = '';
      tocItems = tocSections.map(section => {
        const el = document.getElementById(section.id);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'toc-item';
        button.textContent = section.title;
        button.addEventListener('click', () => {
          el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTocOpen(false);
        });
        tocList.appendChild(button);
        return { ...section, el, button };
      });
    }

    function updateToc() {
      const notesRect = notesDrawer.getBoundingClientRect();
      const notesVisible = notesRect.top < window.innerHeight * 0.78 && notesRect.bottom > 180;
      tocIslandWrap.classList.toggle('visible', notesVisible);
      if (!notesVisible) setTocOpen(false);

      let active = tocItems[0];
      tocItems.forEach(item => {
        if (item.el && item.el.getBoundingClientRect().top <= 150) active = item;
      });

      tocItems.forEach(item => item.button.classList.toggle('active', item.id === active?.id));
      if (active) tocActiveTitle.textContent = active.title;

      const total = document.documentElement.scrollHeight - window.innerHeight;
      const percent = total > 0 ? Math.min(100, Math.max(0, (window.scrollY / total) * 100)) : 0;
      const circumference = 69;
      tocProgress.style.strokeDashoffset = String(circumference - (percent / 100) * circumference);
    }

    if (tocEnabled) {
      buildToc();
      tocOpenBtn.addEventListener('click', () => setTocOpen(true));
      tocCloseBtn.addEventListener('click', () => setTocOpen(false));
      tocBackdrop.addEventListener('click', () => setTocOpen(false));
      document.addEventListener('scroll', updateToc, { passive: true });
      window.addEventListener('resize', updateToc);
      updateToc();
    }

    const motionAllowed = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const revealItems = Array.from(document.querySelectorAll('.reveal, .note-section'));
    revealItems.forEach((item, index) => {
      item.classList.add(`stagger-${(index % 4) + 1}`);
    });

    function revealVisible() {
      revealItems.forEach(item => {
        const rect = item.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.92 && rect.bottom > 0) item.classList.add('is-visible');
      });
    }

    if (motionAllowed) {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

      revealItems.forEach(item => observer.observe(item));
    } else {
      revealItems.forEach(item => item.classList.add('is-visible'));
    }
  </script>
</body>
</html>
