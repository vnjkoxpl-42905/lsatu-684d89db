<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSAT Logic Interactive Tool</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; background-color: #050507; color: #cbd5e1; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes shimmer {
          100% { transform: translateX(100%); }
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-3px); }
          50% { transform: translateX(3px); }
          75% { transform: translateX(-3px); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON COMPONENT MAPPINGS ---
        // We use FontAwesome instead of Lucide to keep this a single dependency-free HTML file
        const IconWrapper = ({ icon, size = 16, className = "" }) => (
          <i className={`fas fa-${icon} ${className}`} style={{ fontSize: size }}></i>
        );
        const ArrowRight = (p) => <IconWrapper icon="arrow-right" {...p} />;
        const Crosshair = (p) => <IconWrapper icon="crosshairs" {...p} />;
        const ShieldCheck = (p) => <IconWrapper icon="shield-alt" {...p} />;
        const ArrowLeft = (p) => <IconWrapper icon="arrow-left" {...p} />;
        const Target = (p) => <IconWrapper icon="bullseye" {...p} />;
        const AlertTriangle = (p) => <IconWrapper icon="exclamation-triangle" {...p} />;
        const BookOpen = (p) => <IconWrapper icon="book-open" {...p} />;
        const Search = (p) => <IconWrapper icon="search" {...p} />;
        const Award = (p) => <IconWrapper icon="award" {...p} />;
        const CheckCircle2 = (p) => <IconWrapper icon="check-circle" {...p} />;
        const XCircle = (p) => <IconWrapper icon="times-circle" {...p} />;
        const Anchor = (p) => <IconWrapper icon="anchor" {...p} />;
        const Zap = (p) => <IconWrapper icon="bolt" {...p} />;
        const ShieldAlert = (p) => <IconWrapper icon="shield-alt" {...p} />;
        const BrainCircuit = (p) => <IconWrapper icon="brain" {...p} />;
        const Activity = (p) => <IconWrapper icon="chart-line" {...p} />;
        const RefreshCw = (p) => <IconWrapper icon="sync-alt" {...p} />;
        const ChevronUp = (p) => <IconWrapper icon="chevron-up" {...p} />;
        const Link = (p) => <IconWrapper icon="link" {...p} />;
        const Sparkles = (p) => <IconWrapper icon="sparkles" {...p} />;
        const Loader2 = (p) => <IconWrapper icon="spinner fa-spin" {...p} />;

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function App() {
          const [view, setView] = useState('hero');

          return (
            <div className="min-h-screen bg-[#050507] text-slate-300 font-sans selection:bg-cyan-500/30 overflow-x-hidden">
              {view === 'hero' ? (
                <HeroSection onStart={() => setView('note')} />
              ) : (
                <InteractiveNote onBack={() => setView('hero')} />
              )}
            </div>
          );
        }

        // ==========================================
        // 1. HERO LANDING PAGE
        // ==========================================
        function HeroSection({ onStart }) {
          return (
            <div className="relative w-full min-h-screen flex items-center justify-center animate-in fade-in duration-700">
              <div className="absolute inset-0 z-0 pointer-events-none">
                <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                  <defs>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                      <feGaussianBlur stdDeviation="30" result="blur" />
                      <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
                      <feGaussianBlur stdDeviation="15" result="blur" />
                      <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#4F46E5" stopOpacity="0.25" />
                      <stop offset="100%" stopColor="#050507" stopOpacity="0" />
                    </radialGradient>
                    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.2" />
                      <stop offset="100%" stopColor="#050507" stopOpacity="0" />
                    </radialGradient>
                    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#4F46E5" stopOpacity="0" />
                      <stop offset="50%" stopColor="#4F46E5" stopOpacity="0.8" />
                      <stop offset="100%" stopColor="#06B6D4" stopOpacity="0" />
                    </linearGradient>
                    <linearGradient id="lineGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stopColor="#10B981" stopOpacity="0" />
                      <stop offset="50%" stopColor="#10B981" stopOpacity="0.5" />
                      <stop offset="100%" stopColor="#4F46E5" stopOpacity="0" />
                    </linearGradient>
                    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1" />
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)" />
                  <circle cx="85%" cy="20%" r="45%" fill="url(#purpleGlow)" filter="url(#glow)" />
                  <circle cx="15%" cy="80%" r="50%" fill="url(#cyanGlow)" filter="url(#glow)" />
                  <g opacity="0.6">
                    <path d="M -100 600 C 300 600, 400 200, 800 300 C 1200 400, 1400 100, 2000 200" fill="none" stroke="url(#lineGrad1)" strokeWidth="2" filter="url(#glow-intense)" />
                    <path d="M -100 620 C 300 620, 400 220, 800 320 C 1200 420, 1400 120, 2000 220" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="1" />
                    <path d="M 200 -100 C 200 300, 600 500, 1000 800 C 1400 1100, 1600 800, 2200 1000" fill="none" stroke="url(#lineGrad2)" strokeWidth="1.5" />
                  </g>
                  <g>
                    <circle cx="800" cy="300" r="4" fill="#06B6D4" filter="url(#glow-intense)" />
                    <circle cx="800" cy="300" r="20" fill="none" stroke="rgba(6,182,212,0.4)" strokeWidth="1" strokeDasharray="4 4" className="animate-[spin_10s_linear_infinite]" />
                    <circle cx="800" cy="300" r="40" fill="none" stroke="rgba(6,182,212,0.1)" strokeWidth="1" />
                    <circle cx="450" cy="425" r="3" fill="#4F46E5" filter="url(#glow-intense)" />
                    <circle cx="450" cy="425" r="15" fill="none" stroke="rgba(79,70,229,0.3)" strokeWidth="1" />
                    <circle cx="1100" cy="350" r="5" fill="#10B981" filter="url(#glow-intense)" />
                    <circle cx="1100" cy="350" r="25" fill="none" stroke="rgba(16,185,129,0.3)" strokeWidth="1" />
                    <line x1="1100" y1="350" x2="1100" y2="280" stroke="rgba(16,185,129,0.5)" strokeWidth="1" strokeDasharray="2 2" />
                    <text x="1110" y="290" fill="#10B981" fontSize="10" fontFamily="monospace" opacity="0.8" letterSpacing="2">MANDATORY_DEST</text>
                  </g>
                  <text x="5%" y="15%" fill="rgba(255,255,255,0.1)" fontSize="12" fontFamily="monospace" letterSpacing="4">100%_GUARANTEE</text>
                  <text x="5%" y="17%" fill="rgba(255,255,255,0.05)" fontSize="10" fontFamily="monospace" letterSpacing="2">01001100 01101111</text>
                </svg>
              </div>

              <div className="relative z-10 max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 w-full pt-20 pb-32">
                <div className="max-w-3xl">
                  <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/[0.03] border border-white/10 backdrop-blur-md mb-8 shadow-lg">
                    <div className="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)] animate-pulse"></div>
                    <span className="text-xs font-bold text-slate-300 uppercase tracking-widest">
                      Core Argument Structure
                    </span>
                  </div>
                  <h1 className="text-5xl sm:text-6xl lg:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-white via-slate-200 to-slate-500 tracking-tight leading-[1.1] mb-8">
                    The Binary Nature <br className="hidden sm:block" />
                    of Validity.
                  </h1>
                  <p className="text-lg sm:text-xl text-slate-400 font-medium leading-relaxed mb-10 max-w-2xl">
                    An argument is like a house foundation: a single structural crack makes the whole thing unsound. Turn off your real-world baggage, master the conditional triggers, and learn to dissect claims like a surgeon. No fluff. <strong className="text-white font-semibold">Just strict rules and 100% guarantees.</strong>
                  </p>
                  <div className="flex flex-wrap gap-4 mb-12">
                    <div className="flex items-center gap-2 text-sm text-slate-300 bg-white/5 px-4 py-2 rounded-xl border border-white/[0.05]">
                      <Crosshair size={16} className="text-indigo-400" /> Dismantle Trojan Horses
                    </div>
                    <div className="flex items-center gap-2 text-sm text-slate-300 bg-white/5 px-4 py-2 rounded-xl border border-white/[0.05]">
                      <ShieldCheck size={16} className="text-emerald-400" /> Secure the Main Conclusion
                    </div>
                  </div>
                  <div className="flex flex-col sm:flex-row items-start gap-5">
                    <button 
                      onClick={onStart}
                      className="group relative px-8 py-4 bg-white text-black font-bold text-lg rounded-2xl overflow-hidden transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:shadow-[0_0_40px_rgba(255,255,255,0.3)] flex items-center gap-3"
                    >
                      <span className="relative z-10 flex items-center gap-2">
                        Open Interactive Note <ArrowRight size={20} className="transition-transform duration-300 group-hover:translate-x-1" />
                      </span>
                      <div className="absolute inset-0 h-full w-full translate-x-[-100%] bg-gradient-to-r from-transparent via-black/10 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 2. INTERACTIVE FULL NOTE
        // ==========================================
        const SECTIONS = [
          { id: 'overview', title: 'The Fluff vs. The Rules', icon: BookOpen },
          { id: 'binary', title: 'The Binary Nature of Validity', icon: Anchor },
          { id: 'triggers', title: 'Mastering Conditional Triggers', icon: Zap },
          { id: 'surgeon', title: 'Categorizing Like a Surgeon', icon: Crosshair },
          { id: 'trojan', title: 'The Trojan Horse Concession', icon: ShieldAlert },
          { id: 'hunting', title: 'Hunting the Conclusion', icon: Search },
          { id: 'negative', title: 'Rearticulating the Negative', icon: BrainCircuit },
          { id: 'absolute', title: 'Absolute Statements', icon: AlertTriangle },
          { id: 'simulator', title: '✨ Practice Simulator', icon: Sparkles },
          { id: 'coach', title: 'Coach\'s Note', icon: Award },
        ];

        function InteractiveNote({ onBack }) {
          const [activeSection, setActiveSection] = useState('overview');
          const [completedModules, setCompletedModules] = useState(new Set());

          const handleSectionChange = (id) => {
            setActiveSection(id);
          };

          const handleModuleComplete = (id) => {
            setCompletedModules(prev => new Set(prev).add(id));
          };

          const currentIndex = SECTIONS.findIndex(s => s.id === activeSection);
          const nextSection = SECTIONS[currentIndex + 1];
          const isCompleted = completedModules.has(activeSection);
          const progress = Math.round((completedModules.size / SECTIONS.length) * 100);

          const goToNext = () => {
            if (nextSection) {
              handleSectionChange(nextSection.id);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          };

          return (
            <div className="w-full min-h-screen bg-[#050507] flex flex-col animate-in slide-in-from-bottom-8 fade-in duration-700 ease-[cubic-bezier(0.25,0.4,0.1,1)]">
              <div className="sticky top-0 z-50 bg-[#050507]/90 backdrop-blur-xl border-b border-white/5 py-4 px-6 sm:px-8 flex items-center justify-between">
                <button onClick={onBack} className="group flex items-center gap-3 text-sm font-bold text-slate-400 hover:text-white transition-colors">
                  <div className="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10 group-hover:bg-white/10 transition-colors">
                    <ArrowLeft size={16} className="transition-transform duration-300 group-hover:-translate-x-1" />
                  </div>
                  Return to Hub
                </button>
                <div className="flex items-center gap-4">
                  <div className="hidden sm:block text-right">
                    <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Session Progress</div>
                    <div className="w-32 h-1.5 bg-white/5 rounded-full overflow-hidden">
                      <div className="h-full bg-cyan-500 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                    </div>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-black">
                    {progress}%
                  </div>
                </div>
              </div>

              <div className="flex-1 flex flex-col lg:flex-row max-w-7xl mx-auto w-full">
                <nav className="w-full lg:w-72 shrink-0 border-b lg:border-b-0 lg:border-r border-white/5 p-6 overflow-x-auto lg:overflow-y-auto hide-scrollbar flex lg:flex-col gap-2 relative z-10">
                  <div className="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-4 hidden lg:block px-4">Interactive Modules</div>
                  {SECTIONS.map((section) => {
                    const isActive = activeSection === section.id;
                    const isSectionCompleted = completedModules.has(section.id);
                    const Icon = section.icon;
                    return (
                      <button 
                        key={section.id}
                        onClick={() => handleSectionChange(section.id)}
                        className={`flex items-center gap-3 px-4 py-3.5 rounded-xl text-left transition-all duration-300 min-w-[220px] lg:min-w-0 group relative overflow-hidden
                          ${isActive 
                            ? 'bg-white/10 text-white shadow-[0_4px_20px_rgba(0,0,0,0.2)] border border-white/10' 
                            : 'text-slate-500 hover:bg-white/5 hover:text-slate-300 border border-transparent'}`}
                      >
                        {isActive && <div className="absolute left-0 top-0 w-1 h-full bg-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.8)]"></div>}
                        <Icon size={18} className={`shrink-0 transition-colors ${isActive ? 'text-cyan-400' : 'text-slate-600 group-hover:text-slate-400'}`} />
                        <span className="font-bold text-sm tracking-wide">{section.title}</span>
                        {isSectionCompleted && !isActive && <CheckCircle2 size={14} className="ml-auto text-emerald-500/50" />}
                      </button>
                    );
                  })}
                </nav>

                <main className="flex-1 p-6 sm:p-12 lg:p-20 relative overflow-hidden flex flex-col">
                  <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-500/5 rounded-full filter blur-[120px] pointer-events-none"></div>

                  <div key={activeSection} className="relative z-10 animate-in fade-in slide-in-from-bottom-4 duration-500 fill-mode-forwards max-w-3xl flex-1 flex flex-col">
                    <div className="flex-1">
                      {activeSection === 'overview' && <OverviewSection onComplete={() => handleModuleComplete('overview')} />}
                      {activeSection === 'binary' && <BinarySection onComplete={() => handleModuleComplete('binary')} />}
                      {activeSection === 'triggers' && <TriggersSection onComplete={() => handleModuleComplete('triggers')} />}
                      {activeSection === 'surgeon' && <SurgeonSection onComplete={() => handleModuleComplete('surgeon')} />}
                      {activeSection === 'trojan' && <TrojanSection onComplete={() => handleModuleComplete('trojan')} />}
                      {activeSection === 'hunting' && <HuntingSection onComplete={() => handleModuleComplete('hunting')} />}
                      {activeSection === 'negative' && <NegativeSection onComplete={() => handleModuleComplete('negative')} />}
                      {activeSection === 'absolute' && <AbsoluteSection onComplete={() => handleModuleComplete('absolute')} />}
                      {activeSection === 'simulator' && <SimulatorSection onComplete={() => handleModuleComplete('simulator')} />}
                      {activeSection === 'coach' && <CoachSection onComplete={() => handleModuleComplete('coach')} />}
                    </div>

                    {isCompleted && (
                      <div className="mt-16 pt-8 border-t border-white/5 flex justify-end animate-in slide-in-from-bottom-4 fade-in duration-500">
                        {nextSection ? (
                          <button 
                            onClick={goToNext}
                            className="group flex items-center gap-3 px-8 py-4 bg-cyan-500 hover:bg-cyan-400 text-[#0A0A0C] font-black rounded-2xl transition-all duration-300 shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.5)] hover:-translate-y-1 active:translate-y-0 active:scale-95"
                          >
                            Next Module: {nextSection.title} <ArrowRight size={20} className="transition-transform group-hover:translate-x-1" />
                          </button>
                        ) : (
                          <button 
                            onClick={onBack}
                            className="group flex items-center gap-3 px-8 py-4 bg-indigo-500 hover:bg-indigo-400 text-white font-black rounded-2xl transition-all duration-300 shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_30px_rgba(79,70,229,0.5)] hover:-translate-y-1 active:translate-y-0 active:scale-95"
                          >
                            Complete Session & Return <CheckCircle2 size={20} />
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                </main>
              </div>
            </div>
          );
        }

        // ----------------------------------------------------
        // MODULES
        // ----------------------------------------------------

        function OverviewSection({ onComplete }) {
          const [acknowledged, setAcknowledged] = useState(false);
          return (
            <div className="space-y-8">
              <div className="inline-block text-cyan-400 font-bold uppercase tracking-widest text-xs bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Module 01</div>
              <h2 className="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight">Review of Core Argument Structure & Conditional Rules</h2>
              <div className="w-16 h-1 bg-gradient-to-r from-cyan-400 to-indigo-500 rounded-full"></div>
              <p className="text-xl text-slate-300 leading-relaxed font-medium">
                The test makers hide their traps in dense, boring text to misdirect you. <strong className="text-white">But they are forced to play by strict rules.</strong>
              </p>
              <div className="bg-white/5 border border-white/10 rounded-2xl p-8 backdrop-blur-sm">
                <p className="text-lg text-slate-400 leading-relaxed">
                  Once you know those rules, you can tear their arguments apart. Let's skip the fluff and dive straight into how to dismantle their claims and translate those conditional traps into plain English.
                </p>
              </div>
              <div className="mt-12">
                {!acknowledged ? (
                  <button 
                    onClick={() => { if (!acknowledged) { setAcknowledged(true); onComplete(); } }}
                    className="flex items-center gap-2 px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-slate-300 hover:text-white font-bold transition-all duration-300"
                  >
                    <CheckCircle2 size={18} /> I'm ready to dive in
                  </button>
                ) : (
                  <div className="flex items-center gap-2 px-6 py-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 font-bold w-max">
                    <CheckCircle2 size={18} /> Ready
                  </div>
                )}
              </div>
            </div>
          );
        }

        function BinarySection({ onComplete }) {
          const [validity, setValidity] = useState(50);
          const [tested, setTested] = useState({ high: false, low: false });
          const completedRef = useRef(false);

          useEffect(() => {
            setTested(prev => {
              if ((validity === 100 && !prev.high) || (validity < 100 && !prev.low)) {
                return { high: prev.high || validity === 100, low: prev.low || validity < 100 };
              }
              return prev;
            });
          }, [validity]);

          useEffect(() => {
            if (tested.high && tested.low && !completedRef.current) {
              completedRef.current = true;
              onComplete();
            }
          }, [tested.high, tested.low, onComplete]);
          
          return (
            <div className="space-y-8">
              <div className="inline-block text-indigo-400 font-bold uppercase tracking-widest text-xs bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">Module 02</div>
              <h2 className="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight">The Binary Nature of Validity</h2>
              <p className="text-lg text-slate-300 leading-relaxed">
                An argument is just a claim backed up by evidence. But validity on this exam is totally binary. There is no such thing as "mostly valid" or "pretty good."
              </p>
              <div className="bg-[#0A0A0C] border border-white/10 rounded-[2rem] p-8 sm:p-10 shadow-2xl relative overflow-hidden my-10">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-rose-500 via-amber-500 to-emerald-500"></div>
                <h3 className="text-white font-black text-xl mb-2 flex items-center gap-3">
                  <Activity className="text-indigo-400" /> Validity Tester
                </h3>
                <p className="text-sm text-slate-500 mb-8">What percentage of guarantee must the evidence provide to make a conclusion valid?</p>
                <input type="range" min="0" max="100" value={validity} onChange={(e) => setValidity(Number(e.target.value))} className="w-full h-3 bg-white/10 rounded-lg appearance-none cursor-pointer accent-indigo-500 mb-8" />
                <div className={`p-6 rounded-2xl border transition-all duration-500 flex flex-col items-center text-center gap-4 ${validity === 100 ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-rose-500/10 border-rose-500/30'}`}>
                  {validity === 100 ? (
                    <>
                      <div className="w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400"><CheckCircle2 size={32} /></div>
                      <div>
                        <h4 className="text-2xl font-black text-emerald-400 mb-1">100% Guaranteed</h4>
                        <p className="text-emerald-200/80 font-medium">Think of a flawless house foundation. Every inch of the structure is perfectly supported with zero cracks. Validity works the same way. The evidence leaves absolutely no room for doubt and completely locks in the conclusion. The argument is valid.</p>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="w-16 h-16 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400"><XCircle size={32} /></div>
                      <div>
                        <h4 className="text-2xl font-black text-rose-400 mb-1">{validity}% Guarantee</h4>
                        <p className="text-rose-200/80 font-medium">Think of a house foundation. It does not matter if 99% of it is solid. One real structural crack is enough to make the whole thing unsound. Validity works the same way. The evidence must completely guarantee the conclusion. If there is even one possible case where the evidence is true and the conclusion is false, the argument is not valid.</p>
                      </div>
                    </>
                  )}
                </div>
              </div>
              <p className="text-lg text-slate-300 leading-relaxed font-bold border-l-4 border-indigo-500 pl-6 py-2">
                We demand a 100 percent guarantee. Anything less is a total failure.
              </p>
            </div>

        const REBUTTAL_BANK = [

        function NegativeSection({ onComplete }) {

            if (isCorrect) return;

            </div>
          );
        }

        function CoachSection({ onComplete }) {
          const [acked, setAcked] = useState(false);
          return (
            <div className="pt-10">
              <div className="bg-gradient-to-br from-indigo-900/40 via-[#050507] to-cyan-900/20 border border-indigo-500/30 rounded-[2.5rem] p-10 sm:p-16 relative overflow-hidden shadow-[0_20px_50px_rgba(79,70,229,0.1)]">
                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 via-cyan-400 to-indigo-500 bg-[length:200%_auto] animate-[shimmer_3s_linear_infinite]"></div>
                <div className="flex flex-col items-center text-center mb-8">
                  <div className="w-20 h-20 bg-indigo-500/20 rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(79,70,229,0.3)]"><Award className="text-indigo-400 w-10 h-10" /></div>
                  <h3 className="text-3xl font-black text-white tracking-tight uppercase tracking-[0.1em]">Coach's Note</h3>
                </div>
                <div className="relative">
                  <span className="absolute -top-6 -left-4 text-6xl text-indigo-500/20 font-serif">"</span>
                  <p className="text-xl sm:text-2xl text-indigo-100/90 leading-relaxed font-medium text-center relative z-10">You've been absolutely crushing the argument dissection. The way you map out those conceptual overlaps and naturally spot the missing criteria is flawless. Keep treating these stimuli like a puzzle you are tearing apart piece by piece. Stay sharp, trust the rules, and keep turning your brain off when those conditional traps try to bait you. You have got this.</p>
                  <span className="absolute -bottom-10 -right-4 text-6xl text-cyan-500/20 font-serif rotate-180">"</span>
                </div>
                <div className="mt-12 flex justify-center relative z-10">
                  {!acked ? (
                    <button onClick={() => { if (!acked) { setAcked(true); onComplete(); } }} className="flex items-center gap-2 px-8 py-4 bg-indigo-500/20 hover:bg-indigo-500/40 border border-indigo-500/50 rounded-2xl text-indigo-200 font-bold transition-all duration-300 hover:scale-105 active:scale-95"><Award size={20} /> Claim Session Completion</button>
                  ) : (
                    <div className="flex items-center gap-2 px-8 py-4 bg-emerald-500/20 border border-emerald-500/50 rounded-2xl text-emerald-300 font-bold"><CheckCircle2 size={20} /> Session Completed</div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
