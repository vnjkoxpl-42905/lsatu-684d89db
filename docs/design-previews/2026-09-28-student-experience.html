<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSAT U | Student experience concept</title>
  <style>
    :root{--paper:#fbf8f4;--rail:#fffaf6;--white:#fff;--ink:#292621;--muted:#70675e;--line:#e9dfd4;--sand:#eadfce;--sand-dark:#d9cbb7;--amber:#ed8700;--amber-light:#fff0d5;--dark:#25211d;--blue:#557cad;--radius:14px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Outfit,"Avenir Next",Arial,sans-serif;font-size:15px;line-height:1.42}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}a{color:inherit}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.1}h1,.display{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.035em}h1{font-size:clamp(30px,3vw,43px);margin-bottom:10px}h2{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:400;letter-spacing:-.025em;margin-bottom:6px}h3{font-size:16px;margin-bottom:6px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11px;letter-spacing:.03em}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#896344}.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.rail{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 25px;font-weight:700;letter-spacing:.035em}.brand-mark{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#35322d;color:#fff;font-size:11px}.rail-title{padding:0 12px;color:#8a7767;font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:11px}.nav{display:grid;gap:5px}.nav button{width:100%;min-height:43px;border:0;border-radius:9px;background:transparent;color:#453e37;text-align:left;padding:0 13px;display:flex;align-items:center;gap:12px}.nav button:hover{background:#f2ebe3}.nav button.active{background:#3e3a36;color:white;font-weight:650}.nav .glyph{width:20px;text-align:center;font-size:17px;line-height:1}.rail-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:17px}.rail-bottom button{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;text-align:left;padding:10px 12px;color:var(--ink)}.rail-bottom .profile{display:flex;align-items:center;gap:9px;margin-bottom:11px}.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#f8ead8;color:#79542d;font-size:12px}.main{min-width:0;padding:19px clamp(20px,3vw,42px) 56px}.content{max-width:1360px;margin:auto}.topbar{height:57px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}.topbar-left{display:flex;align-items:center;gap:13px}.menu{display:none}.topbar .utility{display:flex;align-items:center;gap:8px}.topbar button,.plain-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;color:var(--ink);min-height:42px}.topbar .search{min-width:235px;text-align:left;color:#5f554b}.badge{display:inline-grid;place-items:center;margin-left:5px;min-width:19px;height:19px;border-radius:50%;background:var(--amber);color:#fff;font-size:11px;font-weight:700}.sample{background:#fff4dc;border:1px solid #ebd9b7;border-radius:999px;color:#825d2d;padding:7px 11px;font-size:11px;font-weight:650;white-space:nowrap}.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:19px}.page-head p{margin-bottom:0}.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin:18px 0 22px;padding-bottom:1px}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);white-space:nowrap;padding:11px 15px;margin-bottom:-1px;min-height:45px}.tabs button.selected{color:var(--ink);border-bottom-color:var(--amber);font-weight:700}.grid{display:grid;gap:15px}.two{grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:20px}.panel.sand{background:#e1d5c3;border-color:#e1d5c3}.panel h2{margin-bottom:15px}.primary{border:0;border-radius:9px;background:var(--amber);color:#241b12;font-weight:700;padding:11px 16px;min-height:44px}.secondary{border:1px solid #c8b9a9;border-radius:9px;background:transparent;color:var(--ink);font-weight:600;padding:10px 14px;min-height:44px}.text-button{border:0;background:transparent;color:#754508;text-decoration:underline;text-underline-offset:3px;padding:7px 0;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.list-card{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;border:1px solid #ece4d9;border-radius:11px;padding:15px}.list-card p{margin:4px 0 0;color:var(--muted);font-size:12px}.list-card h3{margin:0}.pill{display:inline-block;background:#f5e8d7;border-radius:999px;padding:5px 9px;font-size:11px;color:#71532e;white-space:nowrap}.pill.cool{background:#e9eef4;color:#4b6585}.home-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;background:linear-gradient(112deg,#fff8eb,#f8ddb5);border-radius:24px;padding:27px 31px;margin-bottom:15px;min-height:252px}.home-hero h1{font-size:clamp(33px,3.2vw,50px);margin:6px 0 9px}.hero-copy{max-width:43ch}.hero-copy p{color:#564c40;margin-bottom:0}.next-card{background:var(--dark);color:#fff;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between}.next-card .eyebrow{color:#f6bb65}.next-card h2{font-size:27px;margin:6px 0}.next-card p{color:#dccfc1;font-size:13px;margin-bottom:0}.next-card .primary{white-space:nowrap}.home-below{margin-top:15px}.home-below .panel{min-height:228px}.status-line{display:flex;align-items:center;gap:7px;margin-top:10px;color:#63574a;font-size:13px}.dot{width:7px;height:7px;background:var(--amber);border-radius:50%;flex:none}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:13px}.day{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;min-height:65px}.day.today{background:#3e3a36;color:#fff}.day span{font-size:11px;color:inherit;opacity:.65}.day strong{float:right;font-family:Georgia,serif;font-size:18px}.week-label{margin:22px 0 5px;display:flex;justify-content:space-between}.detail{font-size:13px;color:var(--muted);line-height:1.55}.meter{height:7px;background:#eee5d9;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;width:38%;background:var(--amber)}.callout{border-left:3px solid var(--amber);padding:11px 15px;background:#fff7e9;color:#514333;border-radius:0 9px 9px 0}.choice{display:block;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:8px 0;background:#fff}.review-workspace{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.review-workspace textarea{width:100%;min-height:95px;border:1px solid #cfc5b9;border-radius:9px;padding:11px;resize:vertical}.review-workspace label{font-size:13px;font-weight:650}.explanation{background:#f8f3eb}.empty{border:1px dashed #cbbba9;border-radius:12px;background:#fffaf4;padding:25px}.overlay{position:fixed;inset:0;background:rgba(22,19,16,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.overlay.open{display:flex}.dialog{width:min(490px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:25px;box-shadow:0 18px 50px rgba(22,19,16,.18)}.dialog input{width:100%;border:1px solid #bfb4a9;border-radius:8px;padding:11px;margin:9px 0 15px}.dialog .row{margin-top:20px}.mobile-scrim{display:none}.notice{padding:13px 16px;background:#fff5e6;border:1px solid #eedfc7;border-radius:10px;margin-bottom:15px;color:#684e2d;font-size:13px}
    .subtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}.subtabs button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:9px 14px;min-height:42px}.subtabs button.selected{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:700}.breadcrumb{font-size:12px;color:var(--muted);margin:0 0 13px}.exam-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.exam-note{padding:15px 17px;border-radius:11px;background:#fff6e8;border:1px solid #f0dfc3;color:#624626;font-size:13px}.exam-detail-list{display:grid;gap:9px;margin:18px 0}
    @media(max-width:1150px){.app{grid-template-columns:220px minmax(0,1fr)}.rail{padding-left:10px;padding-right:10px}.main{padding-left:20px;padding-right:20px}.home-hero{grid-template-columns:1fr 1fr;padding:22px}.two{grid-template-columns:1fr 1fr}}
    @media(max-width:900px){.app{display:block}.rail{position:fixed;left:0;top:0;width:248px;transform:translateX(-102%);transition:transform .2s ease;box-shadow:8px 0 26px rgba(0,0,0,.08)}.rail.open{transform:translateX(0)}.mobile-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.24);z-index:9}.menu{display:inline-block!important}.main{padding:13px 18px 40px}.topbar .search{min-width:0}.topbar .search span{display:none}.topbar .search:after{content:"Find question"}.sample{display:none}}
    @media(max-width:650px){.home-hero,.two,.three,.review-workspace{grid-template-columns:1fr}.home-hero{gap:15px;padding:22px}.next-card{min-height:205px}.topbar .search:after{content:"Search"}.topbar button{padding:9px 10px}.week{grid-template-columns:repeat(4,1fr)}.day:nth-child(n+5){display:none}.page-head{display:block}.page-head .primary{margin-top:12px}.list-card{align-items:flex-start}.list-card .secondary{white-space:nowrap}.main{padding-left:14px;padding-right:14px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rail{transition:none}}
  </style>
</head>
<body>
<div class="mobile-scrim" id="scrim"></div>
<div class="app">
  <aside class="rail" id="rail" aria-label="Student navigation">
    <div class="brand"><span class="brand-mark">LS</span> LSAT U</div>
    <div class="rail-title">Classroom</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-bottom"><div class="profile"><span class="avatar">T</span><span><strong>tester</strong><br><span class="small muted">Student view</span></span></div><button data-action="settings">Settings and account</button></div>
  </aside>
  <main class="main"><div class="content">
    <header class="topbar"><div class="topbar-left"><button class="menu" id="menu" aria-label="Open navigation">☰</button><strong id="top-title">Home</strong><span class="sample">Design sample, not live data</span></div><div class="utility"><button class="search" data-action="search" aria-label="Find a question">⌕ <span>Find a question</span></button><button data-action="inbox" aria-label="Inbox, 1 unread message">Inbox <span class="badge">1</span></button></div></header>
    <div id="page"></div>
  </div></main>
</div>
<div class="overlay" id="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" id="dialog"></div></div>
<script>
  const navItems=[['home','⌂','Home'],['work','▤','My Work'],['practice','◉','Practice'],['review','◇','Review'],['progress','▥','Progress'],['library','▦','Library'],['schedule','◷','Schedule']];
  const labels=Object.fromEntries(navItems.map(x=>[x[0],x[2]]));
  const tabs={work:['To do','Completed','Notes & recaps'],practice:['Drills','Practice Exams'],review:['To review','Wrong answers','Flagged','From Joshua'],progress:['Overview','History','Topics'],library:['Lessons','Activities','Bootcamps','Admissions']};
  const examTabs=['Overview','All Exams','Attempts'];
  let state={page:'home',tab:'',examTab:'Overview',examDetail:'',question:false,reviewed:false};
  const page=document.getElementById('page'),nav=document.getElementById('nav'),rail=document.getElementById('rail'),scrim=document.getElementById('scrim'),overlay=document.getElementById('overlay'),dialog=document.getElementById('dialog');
  const button=(label,action,kind='secondary')=>`<button class="${kind}" data-action="${action}">${label}</button>`;
  const head=(title,desc,action='')=>`<div class="page-head"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`;
  const tabbar=key=>`<div class="tabs" role="tablist" aria-label="${labels[key]} sections">${tabs[key].map(t=>`<button role="tab" aria-selected="${state.tab===t}" class="${state.tab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('')}</div>`;
  const card=(title,meta,action,tag='')=>`<div class="list-card"><div>${tag?`<span class="pill">${tag}</span>`:''}<h3>${title}</h3><p>${meta}</p></div>${button(action[0],action[1])}</div>`;
  function home(){return `<section class="home-hero"><div class="hero-copy"><span class="eyebrow">Monday, September 28</span><h1>Good morning,<br>tester.</h1><p>One assignment needs attention. Joshua sent a new Activity. Start with the work that is already assigned to you.</p><div class="status-line"><span class="dot"></span>44 days until the test date in this sample</div></div><div class="next-card"><div><span class="eyebrow">Next from Joshua</span><h2>Logical Reasoning<br>Timed Section</h2><p>Assigned homework · 70 minutes · overdue in this sample</p></div><div class="row"><span class="small">Complete this before your next session</span>${button('Continue assignment','work','primary')}</div></div></section><div class="grid two home-below"><section class="panel sand"><div class="row"><h2>Assigned to you</h2><span class="pill">2 open</span></div><div class="stack">${card('Logical Reasoning · Timed Section','Homework · timed work · overdue',['Continue','work'],'Next')}${card('Spot the Relationship','Activity · name the relationship and its exact words',['Open Activity','activity'],'New')}</div><div class="status-line"><span class="dot"></span><button class="text-button" data-action="review">Review questions waiting for you</button></div></section><section class="panel"><div class="row"><h2>From Joshua</h2><span class="pill">1 unread</span></div><p class="detail">“New assignment: Spot the Relationship. Name the relationship and the exact words that create it.”</p>${button('Open Inbox','inbox')}<div style="border-top:1px solid var(--line);margin:20px 0 13px"></div><div class="row"><div><strong>Next session</strong><div class="small muted">See your schedule and preparation</div></div>${button('Schedule','schedule')}</div></section></div><div class="week-label"><strong class="eyebrow">Next seven days</strong><span class="small muted">Sample week</span></div><div class="week">${[['Mon','28'],['Tue','29'],['Wed','30'],['Thu','1'],['Fri','2'],['Sat','3'],['Sun','4']].map((x,i)=>`<div class="day ${i===0?'today':''}"><span>${x[0]}</span><strong>${x[1]}</strong><br><span>${i>4?'Rest':'Open'}</span></div>`).join('')}</div>`}
  function work(){let body='';if(state.tab==='To do')body=`<div class="grid two"><div class="stack">${card('Logical Reasoning · Timed Section','From Joshua · assigned homework · 70 minutes',['Continue','timed'],'Overdue')}${card('Spot the Relationship','From Joshua · Activity · not started',['Open Activity','activity'],'New')}</div><aside class="panel"><h2>Why this work is here</h2><p class="detail">These are assignments Joshua gave you. The timed section and Activity have different start screens, but both return here when completed.</p><div class="callout">An assignment appears here even before you answer its first question.</div></aside></div>`;else if(state.tab==='Completed')body=`<div class="empty"><h3>No completed sample work</h3><p class="muted">When an assignment is finished, its result and linked review will appear here.</p>${button('Return to To do','todo')}</div>`;else body=`<div class="grid two"><div class="stack">${card('Session recap','Teacher recap · linked to your next assignment',['Open recap','recap'],'From Joshua')}${card('Your notes','Private study notes · kept separate from recaps',['Open notes','notes'])}</div><aside class="panel"><h2>One place for context</h2><p class="detail">Recaps, teacher notes, and your own notes have different authors and records. My Work brings them together without changing what each one means.</p></aside></div>`;return head('My Work','Everything Joshua assigned, plus the notes that explain what comes next.')+tabbar('work')+body}
  function practice(){
    const intro=head('Practice','Choose a drill or open Practice Exams. Timed work starts only after you review its details.')+tabbar('practice');
    if(state.tab==='Drills')return intro+`<div class="grid two"><section class="panel"><h2>Start a drill</h2><p class="detail">Smart Drill is the quick start. Choose questions shows the available pool and exact set before you begin.</p><div class="exam-actions">${button('Smart Drill','smart','primary')}${button('Choose questions','builder')}</div></section><section class="panel"><h2>Saved sets</h2><p class="detail">Return to a set you made, or inspect a known question without creating a scored attempt.</p><div class="exam-actions">${button('Open saved sets','saved-sets')}${button('Find a question','search')}</div></section></div>`;
    return intro+practiceExams();
  }
  function practiceExams(){
    const local=`<div class="breadcrumb">Practice / Practice Exams</div><div class="subtabs" role="tablist" aria-label="Practice Exams sections">${examTabs.map(t=>`<button role="tab" aria-selected="${state.examTab===t}" class="${state.examTab===t?'selected':''}" data-exam-tab="${t}">${t}</button>`).join('')}</div>`;
    if(state.examDetail)return local+`<button class="text-button" data-action="all-exams">← Back to All Exams</button><div class="page-head"><div><h2>PrepTest ${state.examDetail}</h2><p class="muted">Example exam detail · available sections and your attempts in one place</p></div></div><div class="grid two"><section class="panel"><h2>Start options</h2><p class="detail">Choose the full exam or one standalone timed section. The next screen confirms timing, accommodations, source, and access.</p><div class="exam-actions">${button('Start full PrepTest','exam-start','primary')}${button('Start timed section','timed')}</div><div class="exam-detail-list"><div class="list-card"><div><h3>Section 1 · Logical Reasoning</h3><p>25 questions · timing confirmed before start</p></div></div><div class="list-card"><div><h3>Section 2 · Reading Comprehension</h3><p>4 passages · timing confirmed before start</p></div></div></div></section><aside class="panel"><h2>Your attempts</h2><p class="detail">${state.examDetail==='135'?'One sample attempt is paused after Section 1.':'No sample attempt has started for this exam.'} Results stay available after test access ends, while restricted questions cannot be resumed.</p>${button('See all Attempts','attempts')}</aside></div>`;
    if(state.examTab==='All Exams')return local+`<div class="page-head"><div><h2>All Exams</h2><p class="muted">Find a PrepTest, see its sections, and see your attempts before starting.</p></div></div><div class="stack">${card('PrepTest 135','Example available test · full exam and timed sections',['Open exam','exam-detail-135'],'Available')}${card('PrepTest 136','Example available test · no attempt yet',['Open exam','exam-detail-136'],'Available')}</div>`;
    if(state.examTab==='Attempts')return local+`<div class="page-head"><div><h2>Attempts</h2><p class="muted">Full exams and standalone timed sections, in progress and completed.</p></div></div><div class="stack">${card('PrepTest 135 · full exam','Example · paused after Section 1 · saved to the student account',['Continue','exam-resume'],'In progress')}${card('PrepTest 136 · LR timed section','Example · 12 of 25 questions answered · paused',['Continue','exam-resume'],'In progress')}${card('PrepTest 134 · completed','Example · result and question review remain available',['View Results','exam-results'],'Completed')}</div><p class="detail" style="margin-top:16px">General question history still lives in Progress. Attempts is for exam and timed-section sittings.</p>`;
    return local+`<div class="grid two"><section class="panel"><h2>Start a full PrepTest</h2><p class="detail">Choose an available exam. Review its sections, timing, accommodations, and access before the clock starts.</p>${button('Choose a PrepTest','all-exams','primary')}</section><section class="panel"><h2>Start a timed section</h2><p class="detail">Choose a PrepTest and LR or RC section. The start screen confirms its duration.</p>${button('Choose a section','timed')}</section></div><section class="panel" style="margin-top:15px"><div class="row"><div><h2>Unfinished exams and sections</h2><p class="detail">Resume work saved to this student's account.</p></div>${button('See all Attempts','attempts')}</div><div class="stack">${card('PrepTest 135 · full exam','Example · paused after Section 1 · continue on this device',['Continue','exam-resume'],'In progress')}${card('PrepTest 136 · LR timed section','Example · 12 of 25 questions answered · paused',['Continue','exam-resume'],'In progress')}</div></section><div class="exam-note" style="margin-top:15px">New attempts save answers, position, elapsed time, and results to the student account. Closing the exam page pauses the clock; switching browser tabs does not. This prototype does not start a real exam.</div>`;
  }
  function review(){if(state.question)return reviewQuestion();let intro=state.reviewed?`<div class="notice">Sample question marked reviewed. Its flag and original attempt remain on the record.</div>`:'';let filter=state.tab==='Flagged'?'Flagged':state.tab==='Wrong answers'?'Missed':state.tab==='From Joshua'?'From Joshua':'Needs review';return head('Review','Work through missed, flagged, and teacher-selected questions.')+tabbar('review')+intro+`<div class="grid two"><div class="stack">${card('LR · PT 80 · Section 2 · Question 14','First answer B · Correct answer D · from a timed section',['Review question','question'],filter)}${state.tab==='To review'?card('RC · passage 2 · question 7','Flagged during practice · explanation available',['Review question','rc-question'],'Flagged'):''}</div><aside class="panel"><h2>What is in this queue?</h2><p class="detail">Each row says why it is here. Reviewing a question records your reasoning; it does not erase the first answer or remove a flag automatically.</p><div class="callout">A missed question can also be flagged. Those are two reasons on the same question, not duplicate rows.</div></aside></div>`}
  function reviewQuestion(){return `<div class="page-head"><div><button class="text-button" data-action="back-review">← Back to Review</button><h1>Review the reasoning</h1><p class="muted">Illustrative question record · LR · PT 80 · Section 2 · Question 14</p></div></div><div class="review-workspace"><section class="panel"><div class="row"><span class="pill">Missed</span><span class="small muted">First attempt from timed section</span></div><h2 style="margin-top:18px">Your answer and the evidence</h2><p class="detail">The original LSAT question is intentionally omitted from this design sample. In the app, the stimulus, stem, and choices stay visible while you review.</p><div class="choice"><strong>Your first answer: B</strong><br><span class="small muted">Saved when you submitted the timed section</span></div><div class="choice"><strong>Correct answer: D</strong><br><span class="small muted">Revealed after the attempt</span></div><div class="callout">This sample illustrates a necessary versus sufficient condition error. The real explanation must cite the exact language of the question.</div></section><section class="panel explanation"><h2>Make the correction stick</h2><p class="detail">Joshua's written explanation and any note on this question would appear here, with author and date.</p><label for="tempting">What made your wrong answer tempting?</label><textarea id="tempting" placeholder="Name the specific words you relied on."></textarea><label for="proof">What words rule it out, and why does D follow?</label><textarea id="proof" placeholder="Use the stimulus and answer choice language."></textarea><p id="review-error" role="alert" class="small" style="color:#9b4119"></p><div class="row">${button('Ask Joshua','inbox')}${button(state.reviewed?'Reviewed':'Mark reviewed','mark-reviewed','primary')}</div></section></div>`}
  function progress(){let body='';if(state.tab==='Overview')body=`<div class="grid three"><section class="panel"><h2>Review waiting</h2><p class="display" style="font-size:44px;margin:10px 0">2</p><p class="detail">Illustrative count from this prototype</p>${button('Open Review','review')}</section><section class="panel"><h2>Recent work</h2><p class="detail">One sample timed assignment is in progress. Completed results would link to their question records.</p>${button('Open My Work','work')}</section><section class="panel"><h2>Accuracy by topic</h2><p class="detail">Not enough complete sample attempts to show a reliable percentage.</p>${button('See topics','topics')}</section></div><div class="notice" style="margin-top:15px">Production metrics must disclose the time window, included sources, and sample size. This sample deliberately avoids invented performance percentages.</div>`;else if(state.tab==='History')body=`<div class="stack">${card('Logical Reasoning · Timed Section','Assigned by Joshua · in progress · September 2026',['Open work','work'],'In progress')}${card('PT 80 · Section 2 · Question 14','Illustrative attempt · first answer B · review available',['Review','question'],'Missed')}</div>`;else body=`<div class="empty"><h2>Topics need evidence</h2><p class="muted">Once enough attempts are recorded, each topic will show the included questions, date window, and a specific Review or Practice action.</p>${button('Start a drill','practice')}</div>`;return head('Progress','A clear record of what you did, what needs review, and what to practice next.')+tabbar('progress')+body}
  function library(){let body='';if(state.tab==='Lessons')body=`<div class="grid two"><section class="panel"><h2>Continue learning</h2><p class="detail">Short written lessons lead into an example and then an Activity or drill. The wider topic index can grow after the core study loop is working.</p>${button('Open a sample topic','topic')}</section><section class="panel"><h2>Browse by skill</h2><p class="detail">Find related lessons, your attempts, and targeted practice from a topic hub.</p></section></div>`;else if(state.tab==='Activities')body=`<div class="grid two"><div class="stack">${card('Spot the Relationship','Assigned by Joshua · name the exact relationship and words',['Open Activity','activity'],'New')}${card('Conditional Logic Check','Written exercise · 5 short items',['Preview','activity'])}</div><aside class="panel"><h2>Small reasoning exercises</h2><p class="detail">An Activity names the operation, shows a finish rule, and provides written feedback. Assigned Activities also appear in My Work.</p></aside></div>`;else if(state.tab==='Bootcamps')body=`<div class="empty"><h2>Bootcamps</h2><p class="muted">A bootcamp card will show its sections, assigned status, progress, and Continue action. Joshua keeps separate Bootcamps and Activities tabs in his teacher Library.</p></div>`;else body=`<div class="empty"><h2>Admissions resources</h2><p class="muted">This proposed Library tab appears only when the student's current access permissions allow it.</p></div>`;return head('Library','Lessons, Activities, bootcamps, and other resources that support your work.')+tabbar('library')+body}
  function schedule(){return head('Schedule','Prepare for your next session and find the recap afterward.',button('Book a session','booking','primary'))+`<div class="grid two"><section class="panel"><h2>Your next session</h2><p class="detail">No real calendar connection is used in this design sample. In the app, show the confirmed date, timezone, meeting link, and any preparation Joshua assigned.</p>${button('See preparation','work')}</section><section class="panel"><h2>After the session</h2><p class="detail">The recap appears in My Work, with a link to the follow-up assignment. The schedule and recap should point to the same session record.</p>${button('Notes & recaps','recaps')}</section></div>`}
  function render(){
    const [p,t,examTab,examDetail]=location.hash.slice(1).split('/').map(decodeURIComponent);
    if(labels[p]){
      state.page=p;
      if(t&&tabs[p]?.includes(t))state.tab=t;
      if(p==='practice'&&state.tab==='Practice Exams'){
        state.examTab=examTabs.includes(examTab)?examTab:'Overview';
        state.examDetail=/^(135|136)$/.test(examDetail||'')?examDetail:'';
      }else state.examDetail='';
    }
    if(tabs[state.page]&&!tabs[state.page].includes(state.tab))state.tab=tabs[state.page][0];
    nav.innerHTML=navItems.map(([id,icon,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}><span class="glyph" aria-hidden="true">${icon}</span>${label}</button>`).join('');
    document.getElementById('top-title').textContent=labels[state.page];
    page.innerHTML=({home,work,practice,review,progress,library,schedule})[state.page]();
    document.title=`${labels[state.page]} | LSAT U student concept`;
    closeRail();
  }
  function go(p,t){state.page=p;state.question=false;state.tab=t||tabs[p]?.[0]||'';state.examTab='Overview';state.examDetail='';location.hash=`${p}${t?'/'+encodeURIComponent(t):''}`;render();window.scrollTo(0,0)}
  function goExam(t,detail=''){state.page='practice';state.tab='Practice Exams';state.examTab=t;state.examDetail=detail;location.hash=`practice/Practice%20Exams/${encodeURIComponent(t)}${detail?'/'+detail:''}`;render();window.scrollTo(0,0)}
  function closeRail(){rail.classList.remove('open');scrim.classList.remove('open')}
  function modal(title,body,footer=''){dialog.innerHTML=`<h2 id="dialog-title">${title}</h2>${body}<div class="row">${footer}<button class="secondary" data-action="close">Close</button></div>`;overlay.classList.add('open');dialog.querySelector('input,button')?.focus()}
  document.addEventListener('click',e=>{
    const n=e.target.closest('[data-page],[data-tab],[data-exam-tab],[data-action]');
    if(!n)return;
    if(n.dataset.page){go(n.dataset.page);return}
    if(n.dataset.tab){go(state.page,n.dataset.tab);return}
    if(n.dataset.examTab){goExam(n.dataset.examTab);return}
    const a=n.dataset.action;
    switch(a){
      case'close':overlay.classList.remove('open');break;
      case'work':go('work');break;
      case'review':go('review');break;
      case'practice':go('practice');break;
      case'exam-landing':go('practice','Practice Exams');break;
      case'all-exams':goExam('All Exams');break;
      case'attempts':goExam('Attempts');break;
      case'exam-detail-135':goExam('All Exams','135');break;
      case'exam-detail-136':goExam('All Exams','136');break;
      case'schedule':go('schedule');break;
      case'todo':go('work','To do');break;
      case'recaps':go('work','Notes & recaps');break;
      case'topics':go('progress','Topics');break;
      case'activity':go('library','Activities');break;
      case'question':state.page='review';state.question=true;location.hash='review';render();window.scrollTo(0,0);break;
      case'rc-question':modal('RC review needs its own question view','<p>The production Review workspace will show the passage and RC question together. This design sample does not substitute an LR question for it.</p>');break;
      case'back-review':state.question=false;render();break;
      case'mark-reviewed':{
        const tempting=document.getElementById('tempting'),proof=document.getElementById('proof');
        if(!tempting.value.trim()||!proof.value.trim()){
          document.getElementById('review-error').textContent='Write both parts of the diagnosis before marking reviewed.';
          (!tempting.value.trim()?tempting:proof).focus();break;
        }
        state.reviewed=true;state.question=false;render();break;
      }
      case'exam-start':modal('Before a full PrepTest starts','<p>The real launch confirms test source, section order, duration, accommodations, and access before the clock starts. New answers and progress save to the student account.</p>');break;
      case'exam-resume':modal('Continue saved work','<p>This unfinished attempt belongs to the signed-in student account. A second device may continue only after a clear takeover action, and the first device must stop saving. Closing the exam page pauses elapsed time.</p>');break;
      case'exam-results':modal('Completed exam result','<p>The result opens a compact score and section summary, then question detail and Review. This prototype does not invent a sample score.</p>');break;
      case'timed':modal('Before a timed section starts','<p>This prototype does not start a clock. The real launch shows the section source, sample duration, accommodations, and assignment before Start.</p><div class="callout">The timer starts only after a deliberate Start timed section action.</div>');break;
      case'saved-sets':modal('Saved sets','<p>Each saved drill set shows its question count, source, timing, and feedback mode. Continue appears beside Start when work is in progress.</p>');break;
      case'search':modal('Find a question','<p class="detail">Search by exact PT/S/Q or text. Opening a known question offers Practice or Inspect, with Inspect excluded from scored history.</p><input aria-label="Question search" placeholder="Try PT 80 S2 Q14">','<button class="secondary" data-action="inspect">Inspect sample</button>');break;
      case'inspect':overlay.classList.remove('open');go('review');state.question=true;render();break;
      case'inbox':modal('Inbox · 1 unread','<p><strong>Joshua Fisseha</strong><br>New assignment: Spot the Relationship. Name the relationship and the exact words that create it.</p><p class="detail">The production Inbox would open the full message thread and keep its direct link.</p>');break;
      case'booking':modal('Book a session','<p>The booking flow stays connected to Schedule. This concept does not create a booking.</p>');break;
      case'smart':case'builder':modal(a==='smart'?'Smart Drill':'Choose questions','<p>Before Start, show the question pool, unit, count, time, freshness, and feedback mode. The exact selected questions must match the launched set.</p>');break;
      case'recap':case'notes':case'topic':case'settings':modal(a==='recap'?'Session recap':a==='notes'?'Your notes':a==='topic'?'Topic hub':'Settings and account','<p>This panel sketches the destination. The full record and permission behavior will use the existing LSAT U data and access rules.</p>');break;
    }
  });
  document.getElementById('menu').addEventListener('click',()=>{rail.classList.add('open');scrim.classList.add('open')});scrim.addEventListener('click',closeRail);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){overlay.classList.remove('open');closeRail()}});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
